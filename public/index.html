<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meal-planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F7F2;
    --ink: #1F2A1E;
    --forest: #2F5233;
    --forest-dark: #223D26;
    --mustard: #D9A441;
    --line: #C9D0C2;
    --muted: #6B7566;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 4rem;
  }
  header {
    background: var(--forest);
    color: var(--paper);
    padding: 1.5rem 1.25rem 1.75rem;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.6rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: #C9D9C5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 1rem; }
  section {
    background: var(--card);
    border-radius: 14px;
    padding: 1.1rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 3px rgba(31,42,30,0.08);
  }
  section h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
  }
  input[type=text], input[type=number], input[type=url] {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    border: none;
    border-radius: 9px;
    padding: 0.7rem 1.1rem;
    cursor: pointer;
  }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-primary:active { background: var(--forest-dark); }
  .btn-secondary { background: var(--paper); color: var(--forest); border: 1.5px solid var(--forest); }
  .btn-full { width: 100%; margin-top: 0.6rem; }
  .row { display: flex; gap: 0.5rem; }
  .status { font-size: 0.85rem; margin-top: 0.5rem; }
  .status.error { color: #B3432B; }
  .status.ok { color: var(--forest); }
  .recipe-item {
    display: flex; align-items: flex-start; gap: 0.6rem;
    padding: 0.65rem 0; border-bottom: 1px solid var(--line);
  }
  .recipe-item:last-child { border-bottom: none; }
  .recipe-item input[type=checkbox] { margin-top: 0.2rem; width: 18px; height: 18px; accent-color: var(--forest); }
  .recipe-title { font-weight: 500; font-size: 0.95rem; }
  .recipe-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }
  .empty { color: var(--muted); font-size: 0.88rem; font-style: italic; }

  /* Staples management — pill list with an add box, always editable
     directly rather than only reachable by tapping "Always have" on a
     generated list item */
  .staple-pill-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; }
  .staple-pill {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem 0.4rem 0.3rem 0.7rem; font-size: 0.8rem;
  }
  .staple-pill button {
    background: none; border: none; padding: 0; width: 18px; height: 18px;
    border-radius: 50%; color: var(--muted); font-size: 0.85rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .staple-pill button:active { background: var(--line); }

  /* Shopping list rendered like a till receipt, grouped into collapsible
     category sections */
  .receipt {
    background: #fff;
    font-family: 'JetBrains Mono', monospace;
    padding: 1.5rem 1rem 1.5rem;
    position: relative;
    box-shadow: 0 1px 3px rgba(31,42,30,0.08);
    border-radius: 10px;
  }
  .receipt::before {
    content: '';
    position: absolute;
    top: -7px; left: 0; right: 0; height: 14px;
    background: radial-gradient(circle at 7px 7px, transparent 7px, var(--paper) 7px);
    background-size: 14px 14px;
    background-repeat: repeat-x;
  }
  .receipt-header { text-align: center; margin-bottom: 0.9rem; }
  .receipt-header .r-title { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.15rem; }
  .receipt-header .r-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
  .receipt-divider { border-top: 1px dashed var(--line); margin: 0.6rem 0; }

  .category-group { margin-bottom: 0.3rem; }
  .category-group summary {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.03em; color: var(--forest);
    cursor: pointer; padding: 0.5rem 0; list-style: none;
  }
  .category-group summary::-webkit-details-marker { display: none; }
  .category-group summary::before { content: '▸ '; }
  .category-group[open] summary::before { content: '▾ '; }
  .category-group summary .count { color: var(--muted); font-weight: 400; text-transform: none; }

  .receipt-line {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    font-size: 0.83rem; padding: 0.35rem 0;
  }
  .receipt-line .item-info { flex: 1; }
  .receipt-line .qty { color: var(--forest); white-space: nowrap; font-weight: 600; }
  .receipt-line .used-in { display: block; font-size: 0.66rem; color: var(--muted); font-family: 'Inter', sans-serif; margin-top: 0.1rem; }
  .receipt-line .item-actions { display: flex; gap: 0.3rem; }
  .receipt-line .item-actions button {
    font-family: 'Inter', sans-serif; font-size: 0.68rem; padding: 0.3rem 0.5rem; border-radius: 6px;
  }
  .btn-gotit { background: var(--mustard); color: var(--ink); }
  .btn-staple { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  .sorted-section { margin-top: 1rem; font-family: 'Inter', sans-serif; }
  .sorted-section summary { font-size: 0.75rem; color: var(--muted); cursor: pointer; }
  .sorted-line {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.78rem; padding: 0.3rem 0; color: var(--muted);
  }
  .sorted-line button { font-size: 0.68rem; padding: 0.25rem 0.5rem; background: transparent; border: 1px solid var(--line); color: var(--forest); border-radius: 6px; }

  .plan-card { border: 1.5px solid var(--line); border-radius: 10px; padding: 0.8rem; margin-bottom: 0.6rem; cursor: pointer; }
  .plan-card:active { background: var(--paper); }
  .plan-card .plan-date { font-weight: 600; font-size: 0.9rem; }
  .plan-card .plan-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.15rem; }

  .instructions-recipe { margin-bottom: 1.2rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--line); }
  .instructions-recipe:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .instructions-recipe h3 { font-family: 'Fraunces', serif; font-size: 1rem; margin: 0 0 0.5rem; }
  .instructions-recipe .ing-list { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.6rem; }
  .instructions-recipe ol { padding-left: 1.1rem; font-size: 0.88rem; line-height: 1.5; }
  .instructions-recipe ol li { margin-bottom: 0.5rem; }
  .back-link { font-size: 0.85rem; color: var(--forest); font-weight: 600; cursor: pointer; margin-bottom: 0.8rem; display: inline-block; }
</style>
</head>
<body>

<header>
  <h1>meal-planner</h1>
  <p>Import recipes, plan your week, get a shopping list.</p>
</header>

<main>

  <section>
    <h2>Import a recipe</h2>
    <input type="url" id="recipeUrl" placeholder="Paste a recipe URL">
    <button class="btn-primary btn-full" onclick="importRecipe()">Import</button>
    <div id="importStatus" class="status"></div>
  </section>

  <section>
    <h2>Staples — always have these</h2>
    <div id="stapleList" class="staple-pill-list"></div>
    <div class="row">
      <input type="text" id="newStaple" placeholder="e.g. salt, sugar, olive oil">
      <button class="btn-primary" onclick="addStaple()">Add</button>
    </div>
  </section>

  <!-- Picker: shown only when there's no in-progress plan -->
  <section id="pickerSection" style="display:none;">
    <h2>Plan this week</h2>
    <div id="recipeList" class="empty">Loading…</div>
    <label style="font-size:0.85rem; color:var(--muted); display:block; margin-top:0.8rem;">Servings needed</label>
    <input type="number" id="servingsTarget" value="2" min="1" style="margin-top:0.3rem;">
    <button class="btn-primary btn-full" onclick="startPlan()">Start this week's plan</button>
    <div id="planStatus" class="status"></div>
  </section>

  <!-- Active plan: the shopping list with Got it / Always have actions -->
  <section id="activePlanSection" style="display:none;">
    <h2>This week's shopping list</h2>
    <div id="receiptWrap"></div>
    <button class="btn-primary btn-full" onclick="markOrdered()">Mark as ordered</button>
    <div id="orderStatus" class="status"></div>
  </section>

  <section id="pastWeeksSection" style="display:none;">
    <h2>Past weeks</h2>
    <div id="pastWeeksList"></div>
  </section>

  <section id="planDetailSection" style="display:none;">
    <span class="back-link" onclick="showPastWeeks()">&larr; Back to past weeks</span>
    <h2 id="planDetailTitle">Meals this week</h2>
    <div id="planDetailContent"></div>
  </section>

</main>

<script>
const API = ''; // same-origin

let recipes = [];
let currentPlan = null;

// ---------- Staples management ----------

async function loadStaples() {
  const res = await fetch(`${API}/api/staples`);
  const staples = await res.json();
  const el = document.getElementById('stapleList');

  if (!staples.length) {
    el.innerHTML = '<span class="empty">No staples yet — add things like salt, sugar, oil below.</span>';
    return;
  }

  el.innerHTML = staples.map(s => `
    <span class="staple-pill">
      ${escapeHtml(s.item_name)}
      <button onclick="removeStaple('${s.id}')" title="Remove">&times;</button>
    </span>
  `).join('');
}

async function addStaple() {
  const input = document.getElementById('newStaple');
  const itemName = input.value.trim();
  if (!itemName) return;

  await fetch(`${API}/api/staples`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ itemName })
  });
  input.value = '';
  loadStaples();
  if (currentPlan) loadActivePlanList(); // re-filter the active list if a staple was just added
}

async function removeStaple(id) {
  await fetch(`${API}/api/staples`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  loadStaples();
  if (currentPlan) loadActivePlanList();
}

// ---------- Recipes & picker ----------

async function loadRecipes() {
  const res = await fetch(`${API}/api/recipes`);
  recipes = await res.json();
}

async function importRecipe() {
  const urlInput = document.getElementById('recipeUrl');
  const status = document.getElementById('importStatus');
  const url = urlInput.value.trim();
  if (!url) return;

  status.textContent = 'Importing…';
  status.className = 'status';

  try {
    const res = await fetch(`${API}/api/scrape-recipe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Import failed');

    if (data.needsBrowser) {
      status.textContent = "This site couldn't be scraped even with JS rendering — try another URL.";
      status.className = 'status error';
      return;
    }

    status.textContent = `Saved: ${data.title}${data.confidence === 'low' ? ' (low confidence — worth checking the ingredients)' : ''}`;
    status.className = 'status ok';
    urlInput.value = '';
    await loadRecipes();
    if (!currentPlan) renderPicker();
  } catch (err) {
    status.textContent = err.message;
    status.className = 'status error';
  }
}

function renderPicker() {
  document.getElementById('pickerSection').style.display = 'block';
  const el = document.getElementById('recipeList');
  if (!recipes.length) {
    el.innerHTML = '<div class="empty">No recipes yet — import one above.</div>';
    return;
  }
  el.innerHTML = recipes.map(r => `
    <div class="recipe-item">
      <input type="checkbox" value="${r.id}" id="r-${r.id}">
      <label for="r-${r.id}" style="flex:1;">
        <div class="recipe-title">${escapeHtml(r.title)}</div>
        <div class="recipe-meta">${r.servings ? `serves ${r.servings}` : 'servings unknown'}${r.cook_time_minutes ? ` · ${r.cook_time_minutes} min` : ''}</div>
      </label>
    </div>
  `).join('');
}

async function startPlan() {
  const checked = [...document.querySelectorAll('#recipeList input[type=checkbox]:checked')].map(c => c.value);
  const servingsTarget = parseInt(document.getElementById('servingsTarget').value, 10) || 2;
  const status = document.getElementById('planStatus');

  if (!checked.length) {
    status.textContent = 'Tick at least one recipe first.';
    status.className = 'status error';
    return;
  }

  status.textContent = 'Starting your week…';
  status.className = 'status';

  try {
    const res = await fetch(`${API}/api/weekly-plans`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipeIds: checked, servingsTarget })
    });
    const plan = await res.json();
    if (!res.ok) throw new Error(plan.error || 'Failed to start plan');

    currentPlan = plan;
    document.getElementById('pickerSection').style.display = 'none';
    await loadActivePlanList();
  } catch (err) {
    status.textContent = err.message;
    status.className = 'status error';
  }
}

// ---------- Active plan shopping list ----------

async function loadActivePlanList() {
  const res = await fetch(`${API}/api/weekly-plan-shopping-list?id=${currentPlan.id}`);
  const data = await res.json();
  document.getElementById('activePlanSection').style.display = 'block';
  renderReceipt(data);
}

function renderReceipt(data) {
  const date = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });

  // Group by category, in a fixed sensible shopping order rather than
  // alphabetical (fresh stuff first, cupboard stuff last)
  const categoryOrder = ['Fruit & Veg', 'Meat & Fish', 'Dairy & Eggs', 'Bakery', 'Frozen', 'Store Cupboard', 'Herbs & Spices', 'Other'];
  const grouped = {};
  data.shoppingList.forEach(item => {
    (grouped[item.category] = grouped[item.category] || []).push(item);
  });

  const categoryHtml = categoryOrder
    .filter(cat => grouped[cat] && grouped[cat].length)
    .map(cat => `
      <details class="category-group" open>
        <summary>${cat} <span class="count">(${grouped[cat].length})</span></summary>
        ${grouped[cat].map(item => `
          <div class="receipt-line" data-item="${escapeHtml(item.item)}">
            <span class="item-info">
              ${escapeHtml(item.item)}
              <span class="used-in">${item.usedIn.map(escapeHtml).join(', ')}</span>
            </span>
            <span class="qty">${item.quantity !== null ? item.quantity + (item.unit ? item.unit : '') : ''}</span>
            <span class="item-actions">
              <button class="btn-gotit" onclick="markGotIt('${escapeHtml(item.item)}', this)">Got it</button>
              <button class="btn-staple" onclick="markStaple('${escapeHtml(item.item)}', this)" title="Always have — never show again">Always have</button>
            </span>
          </div>
        `).join('')}
      </details>
    `).join('');

  const sortedThisWeek = data.excludedAsAlreadyHave.length
    ? `<details class="sorted-section">
        <summary>Already sorted this week (${data.excludedAsAlreadyHave.length}) — tap to view/undo</summary>
        ${data.excludedAsAlreadyHave.map(name => `
          <div class="sorted-line">
            ${escapeHtml(name)}
            <button onclick="undoGotIt('${escapeHtml(name)}')">Undo</button>
          </div>
        `).join('')}
      </details>`
    : '';

  document.getElementById('receiptWrap').innerHTML = `
    <div class="receipt">
      <div class="receipt-header">
        <div class="r-title">Shopping List</div>
        <div class="r-sub">${date} · serves ${data.servingsTarget} · ${data.recipeCount} recipe${data.recipeCount === 1 ? '' : 's'}</div>
      </div>
      <div class="receipt-divider"></div>
      ${categoryHtml || '<div class="empty">Nothing left to buy — you have it all!</div>'}
      ${sortedThisWeek}
    </div>
  `;
}

async function markGotIt(itemName, btn) {
  await fetch(`${API}/api/weekly-plan-exclude`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ planId: currentPlan.id, itemName })
  });
  loadActivePlanList(); // full re-render so it moves into "Already sorted"
}

async function undoGotIt(itemName) {
  await fetch(`${API}/api/weekly-plan-exclude`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ planId: currentPlan.id, itemName })
  });
  loadActivePlanList();
}

async function markStaple(itemName, btn) {
  await fetch(`${API}/api/staples`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ itemName })
  });
  loadStaples();
  loadActivePlanList();
}

async function markOrdered() {
  const status = document.getElementById('orderStatus');
  status.textContent = 'Saving…';
  status.className = 'status';

  try {
    const res = await fetch(`${API}/api/weekly-plan?id=${currentPlan.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'ordered' })
    });
    if (!res.ok) throw new Error('Failed to mark as ordered');

    currentPlan = null;
    document.getElementById('activePlanSection').style.display = 'none';
    status.textContent = '';
    renderPicker();
    loadPastWeeks();
  } catch (err) {
    status.textContent = err.message;
    status.className = 'status error';
  }
}

// ---------- Past weeks ----------

async function loadPastWeeks() {
  const res = await fetch(`${API}/api/weekly-plans`);
  const plans = await res.json();
  const ordered = plans.filter(p => p.status === 'ordered');

  const section = document.getElementById('pastWeeksSection');
  if (!ordered.length) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  document.getElementById('pastWeeksList').innerHTML = ordered.map(p => `
    <div class="plan-card" onclick="showPlanDetail('${p.id}')">
      <div class="plan-date">${new Date(p.week_start_date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}</div>
      <div class="plan-meta">serves ${p.servings_target}</div>
    </div>
  `).join('');
}

async function showPlanDetail(planId) {
  const res = await fetch(`${API}/api/weekly-plan?id=${planId}`);
  const plan = await res.json();

  document.getElementById('pastWeeksSection').style.display = 'none';
  document.getElementById('planDetailSection').style.display = 'block';
  document.getElementById('planDetailTitle').textContent =
    new Date(plan.week_start_date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });

  document.getElementById('planDetailContent').innerHTML = plan.recipes.map(r => `
    <div class="instructions-recipe">
      <h3>${escapeHtml(r.title)}</h3>
      <div class="ing-list">${r.ingredients.map(i => escapeHtml(i.item)).join(', ')}</div>
      ${r.steps && r.steps.length ? `<ol>${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>` : '<div class="empty">No steps saved for this recipe.</div>'}
    </div>
  `).join('');
}

function showPastWeeks() {
  document.getElementById('planDetailSection').style.display = 'none';
  loadPastWeeks();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function init() {
  await loadStaples();
  await loadRecipes();
  const res = await fetch(`${API}/api/weekly-plans`);
  const plans = await res.json();
  const inProgress = plans.find(p => p.status === 'planning');

  if (inProgress) {
    currentPlan = inProgress;
    await loadActivePlanList();
  } else {
    renderPicker();
  }
  loadPastWeeks();
}

init();
</script>

</body>
</html>
