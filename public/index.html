<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meal-planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F7F2;
    --ink: #1F2A1E;
    --forest: #2F5233;
    --forest-dark: #223D26;
    --mustard: #D9A441;
    --line: #C9D0C2;
    --muted: #6B7566;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 4rem;
  }
  header {
    background: var(--forest);
    color: var(--paper);
    padding: 1.25rem 1.25rem 1rem;
  }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .tabbar {
    display: flex;
    background: var(--forest-dark);
    position: sticky; top: 0; z-index: 10;
  }
  .tabbar button {
    flex: 1; background: none; border: none; border-radius: 0;
    color: #C9D9C5; font-size: 0.8rem; font-weight: 700; padding: 0.75rem 0.4rem;
    font-family: 'Nunito', sans-serif; cursor: pointer;
  }
  .tabbar button.active { color: #fff; border-bottom: 3px solid var(--mustard); }

  main { max-width: 640px; margin: 0 auto; padding: 1rem; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  section {
    background: var(--card);
    border-radius: 16px;
    padding: 1.1rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 3px rgba(31,42,30,0.08);
  }
  section h2 {
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    margin: 0 0 0.75rem;
  }
  select, input[type=text], input[type=number], input[type=url] {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  button {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    border: none;
    border-radius: 999px;
    padding: 0.7rem 1.2rem;
    cursor: pointer;
  }
  .btn-primary { background: var(--forest); color: #fff; }
  .btn-primary:active { background: var(--forest-dark); }
  .btn-secondary { background: var(--paper); color: var(--forest); border: 1.5px solid var(--forest); }
  .btn-ai { background: var(--mustard); color: var(--ink); }
  .btn-danger { background: #fff; color: #B3432B; border: 1.5px solid #B3432B; }
  .btn-full { width: 100%; margin-top: 0.6rem; }
  .btn-sm { padding: 0.4rem 0.7rem; font-size: 0.78rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  .status { font-size: 0.85rem; margin-top: 0.5rem; }
  .status.error { color: #B3432B; }
  .status.ok { color: var(--forest); }
  .recipe-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0; border-bottom: 1px solid var(--line);
  }
  .recipe-item:last-child { border-bottom: none; }
  .recipe-item .thumb-sm { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .recipe-item .thumb-sm-placeholder {
    width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .recipe-title { font-weight: 700; font-size: 0.95rem; font-family: 'Nunito', sans-serif; }
  .recipe-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.1rem; }
  .empty { color: var(--muted); font-size: 0.88rem; font-style: italic; }

  .recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .recipe-card { position: relative; }
  .recipe-card .thumb {
    width: 100%; aspect-ratio: 4/3; border-radius: 14px; object-fit: cover;
    background: var(--paper); display: block;
  }
  .recipe-card .thumb-placeholder {
    width: 100%; aspect-ratio: 4/3; border-radius: 14px;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #C9D9C5; font-size: 2rem;
  }
  .recipe-card .recipe-title { margin-top: 0.4rem; font-size: 0.85rem; }
  .recipe-card .recipe-meta { font-size: 0.72rem; }
  .recipe-card .add-btn {
    position: absolute; bottom: 0.5rem; right: 0.5rem;
    background: var(--forest); color: #fff; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding: 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  }
  .recipe-card .add-btn.added { background: var(--mustard); color: var(--ink); }

  .staple-pill-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; }
  .staple-pill {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.3rem 0.4rem 0.3rem 0.7rem; font-size: 0.8rem;
  }
  .staple-pill button {
    background: none; border: none; padding: 0; width: 18px; height: 18px;
    border-radius: 50%; color: var(--muted); font-size: 0.85rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .staple-pill button:active { background: var(--line); }

  .receipt {
    background: #fff;
    font-family: 'JetBrains Mono', monospace;
    padding: 1.5rem 1rem 1.5rem;
    position: relative;
    box-shadow: 0 1px 3px rgba(31,42,30,0.08);
    border-radius: 14px;
  }
  .receipt::before {
    content: '';
    position: absolute;
    top: -7px; left: 0; right: 0; height: 14px;
    background: radial-gradient(circle at 7px 7px, transparent 7px, var(--paper) 7px);
    background-size: 14px 14px;
    background-repeat: repeat-x;
  }
  .receipt-header { text-align: center; margin-bottom: 0.9rem; }
  .receipt-header .r-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.15rem; }
  .receipt-header .r-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
  .receipt-divider { border-top: 1px dashed var(--line); margin: 0.6rem 0; }

  .category-group { margin-bottom: 0.3rem; }
  .category-group summary {
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.03em; color: var(--forest);
    cursor: pointer; padding: 0.5rem 0; list-style: none;
  }
  .category-group summary::-webkit-details-marker { display: none; }
  .category-group summary::before { content: '▸ '; }
  .category-group[open] summary::before { content: '▾ '; }
  .category-group summary .count { color: var(--muted); font-weight: 400; text-transform: none; }

  .receipt-line {
    display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
    font-size: 0.83rem; padding: 0.35rem 0;
  }
  .receipt-line .item-info { flex: 1; }
  .receipt-line .qty { color: var(--forest); white-space: nowrap; font-weight: 600; }
  .receipt-line .used-in { display: block; font-size: 0.66rem; color: var(--muted); font-family: 'Inter', sans-serif; margin-top: 0.1rem; }
  .receipt-line .note { display: block; font-size: 0.66rem; color: var(--forest); font-family: 'Inter', sans-serif; margin-top: 0.1rem; font-style: italic; }
  .receipt-line .item-actions { display: flex; gap: 0.3rem; }
  .receipt-line .item-actions button {
    font-family: 'Inter', sans-serif; font-size: 0.68rem; padding: 0.3rem 0.5rem; border-radius: 999px;
  }
  .btn-gotit { background: var(--mustard); color: var(--ink); }
  .btn-staple { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  .sorted-section { margin-top: 1rem; font-family: 'Inter', sans-serif; }
  .sorted-section summary { font-size: 0.75rem; color: var(--muted); cursor: pointer; }
  .sorted-line {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.78rem; padding: 0.3rem 0; color: var(--muted);
  }
  .sorted-line button { font-size: 0.68rem; padding: 0.25rem 0.5rem; background: transparent; border: 1px solid var(--line); color: var(--forest); border-radius: 999px; }

  /* Batch cards — HelloFresh-style: date header, horizontal photo strip, action button */
  .batch-card {
    background: var(--card); border-radius: 16px; padding: 1rem; margin-bottom: 1rem;
    box-shadow: 0 1px 3px rgba(31,42,30,0.08);
  }
  .batch-card .batch-date-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; }
  .batch-card .batch-date { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.05rem; }
  .batch-card .batch-meta { font-size: 0.78rem; color: var(--muted); }
  .photo-strip { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.3rem; margin-bottom: 0.8rem; }
  .photo-strip .strip-item { flex-shrink: 0; width: 84px; text-align: center; cursor: pointer; }
  .photo-strip .strip-item img, .photo-strip .strip-item .strip-placeholder {
    width: 84px; height: 84px; border-radius: 14px; object-fit: cover;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
    display: flex; align-items: center; justify-content: center; color: #C9D9C5; font-size: 1.6rem;
  }
  .photo-strip .strip-item .strip-name { font-size: 0.68rem; margin-top: 0.3rem; line-height: 1.2; }
  .badge { font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; }
  .badge-planning { background: #FCEFD1; color: #8A6416; }
  .badge-ordered { background: #DCE9DC; color: var(--forest); }

  .instructions-recipe { margin-bottom: 1.2rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--line); }
  .instructions-recipe:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .instructions-recipe h3 { font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 800; margin: 0 0 0.5rem; }
  .instructions-recipe .ing-list { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.6rem; }
  .instructions-recipe ol { padding-left: 1.1rem; font-size: 0.88rem; line-height: 1.5; }
  .instructions-recipe ol li { margin-bottom: 0.5rem; }
  .back-link { font-size: 0.85rem; color: var(--forest); font-weight: 700; cursor: pointer; margin-bottom: 0.8rem; display: inline-block; }

  .overlay {
    display: none; position: fixed; inset: 0; background: var(--paper);
    z-index: 20; overflow-y: auto;
  }
  .overlay.active { display: block; }
  .overlay-header { background: var(--forest); padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  .overlay-header .back-link { color: #C9D9C5; margin-bottom: 0; }
  .overlay-content { padding: 1rem; max-width: 640px; margin: 0 auto; padding-bottom: 5rem; }
  .overlay-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 16px; margin-bottom: 1rem; }
  .overlay-img-placeholder {
    width: 100%; aspect-ratio: 16/9; border-radius: 16px; margin-bottom: 1rem;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    color: #C9D9C5; font-size: 2.4rem;
  }
  .overlay-title { font-family: 'Nunito', sans-serif; font-size: 1.3rem; font-weight: 800; margin: 0 0 0.4rem; }
  .overlay-meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
  .nickname-row { margin-bottom: 1rem; }
  .nickname-row label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
  .scale-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
  .scale-row label { font-size: 0.85rem; color: var(--muted); }
  .scale-row input { width: 70px; }
  .overlay-ing-list { font-size: 0.9rem; padding-left: 1.1rem; margin-bottom: 1.2rem; }
  .overlay-ing-list li { margin-bottom: 0.3rem; }
  .overlay-ing-list .qty { font-weight: 600; color: var(--forest); font-family: 'JetBrains Mono', monospace; }

  /* Fixed bottom bar for the picker's "Review recipes" button */
  .sticky-bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper);
    padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08); z-index: 25;
  }
  .sticky-bottom-bar .inner { max-width: 640px; margin: 0 auto; }

  .stepper { display: flex; align-items: center; gap: 0.5rem; }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; padding: 0; background: var(--paper); color: var(--forest); border: 1.5px solid var(--forest); font-size: 1.1rem; line-height: 1; }
  .stepper .val { min-width: 24px; text-align: center; font-weight: 700; }

  .review-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
  .review-item img, .review-item .thumb-sm-placeholder2 {
    width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    background: linear-gradient(135deg, var(--forest) 0%, var(--forest-dark) 100%);
    display: flex; align-items: center; justify-content: center; color: #C9D9C5; font-size: 1.2rem;
  }
  .review-item .review-info { flex: 1; }
  .review-item .remove-x { background: none; border: none; color: var(--muted); font-size: 1.3rem; padding: 0.2rem 0.4rem; }
</style>
</head>
<body>

<header>
  <h1>meal-planner</h1>
</header>

<div class="tabbar">
  <button id="tabbtn-shopping" onclick="switchTab('shopping')">Shopping</button>
  <button id="tabbtn-batches" class="active" onclick="switchTab('batches')">Batches</button>
  <button id="tabbtn-recipes" onclick="switchTab('recipes')">Recipes</button>
  <button id="tabbtn-settings" onclick="switchTab('settings')">Settings</button>
</div>

<main>

  <!-- SHOPPING TAB -->
  <div id="tab-shopping" class="tab-content">
    <section id="shoppingChooserSection">
      <h2>Choose a batch to shop</h2>
      <div id="shoppingChooserList" class="empty">Loading…</div>
    </section>

    <section id="activeShoppingSection" style="display:none;">
      <span class="back-link" onclick="backToShoppingChooser()">&larr; Choose a different batch</span>
      <h2 id="shoppingBatchTitle">Shopping list</h2>
      <div class="row" style="margin-bottom:0.8rem;">
        <button class="btn-ai btn-full" onclick="sortWithAI()">✨ Sort with AI</button>
      </div>
      <div id="receiptWrap"></div>
      <button class="btn-primary btn-full" onclick="markOrdered()">Mark as ordered</button>
      <div id="orderStatus" class="status"></div>
    </section>
  </div>

  <!-- BATCHES TAB (home page) -->
  <div id="tab-batches" class="tab-content active">
    <button class="btn-primary btn-full" onclick="openPicker('new', null)" style="margin-bottom:1rem;">+ New batch</button>

    <div id="batchListSection">
      <div id="batchList" class="empty">Loading…</div>
    </div>

    <div id="batchDetailSection" style="display:none;">
      <span class="back-link" onclick="closeBatchDetail()">&larr; Back to batches</span>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
        <h2 id="batchDetailTitle" style="margin:0;">Batch</h2>
      </div>
      <div id="batchDetailContent"></div>
    </div>
  </div>

  <!-- RECIPES TAB -->
  <div id="tab-recipes" class="tab-content">
    <section>
      <h2>Import a recipe</h2>
      <input type="url" id="recipeUrl" placeholder="Paste a recipe URL">
      <button class="btn-primary btn-full" onclick="importRecipe()">Import</button>
      <div id="importStatus" class="status"></div>
    </section>
    <section>
      <h2>Your recipes</h2>
      <div id="recipeGrid" class="empty">Loading…</div>
    </section>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="tab-content">
    <section>
      <h2>Defaults</h2>
      <label style="font-size:0.85rem; color:var(--muted); display:block; margin-bottom:0.3rem;">Default servings</label>
      <input type="number" id="defaultServingsInput" min="1" onchange="saveDefaultServings()">
      <p class="empty" style="margin-top:0.5rem;">Used to pre-fill servings whenever you add a recipe to a batch.</p>
    </section>
    <section>
      <h2>Staples — always have these</h2>
      <div id="stapleList" class="staple-pill-list"></div>
      <div class="row">
        <input type="text" id="newStaple" placeholder="e.g. salt, sugar, olive oil">
        <button class="btn-primary" onclick="addStaple()">Add</button>
      </div>
    </section>
  </div>

</main>

<!-- Recipe detail overlay -->
<div class="overlay" id="recipeOverlay">
  <div class="overlay-header">
    <span class="back-link" onclick="closeRecipeDetail()">&larr; Back</span>
  </div>
  <div class="overlay-content" id="recipeOverlayContent"></div>
</div>

<!-- Picker + Review overlay (used for both "new batch" and "add to existing batch") -->
<div class="overlay" id="pickerOverlay">
  <div class="overlay-header">
    <span class="back-link" onclick="closePickerOverlay()">&larr; Cancel</span>
    <span style="color:#fff; font-weight:700; font-family:'Nunito',sans-serif;" id="pickerStepLabel">Choose meals</span>
  </div>
  <div class="overlay-content" id="pickerOverlayContent"></div>
  <div class="sticky-bottom-bar" id="pickerBottomBar"></div>
</div>

<script>
const API = '';

let recipes = [];
let batches = [];
let selectedShoppingBatchId = null;
let currentRecipeDetail = null;
let lastShoppingListData = null;
let defaultServings = 2;

// Picker/review state
let pickerMode = null;       // 'new' | 'existing'
let pickerBatchId = null;    // batchId when mode === 'existing'
let pickerScreen = 'grid';   // 'grid' | 'review'
let pendingSelections = new Map(); // recipeId -> servings

// ---------- Helpers ----------

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function cap(str) {
  if (!str) return str;
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function displayName(recipe) {
  return (recipe.nickname && recipe.nickname.trim()) ? recipe.nickname : recipe.title;
}

function formatBatchDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
}

function thumbHtml(recipe, sizeClass) {
  return recipe.image_url
    ? `<img class="${sizeClass}" src="${escapeHtml(recipe.image_url)}" alt="">`
    : `<div class="${sizeClass}-placeholder">🍽️</div>`;
}

// ---------- Tabs ----------

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabbar button').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  document.getElementById(`tabbtn-${name}`).classList.add('active');
}

// ---------- Settings ----------

async function loadSettings() {
  const res = await fetch(`${API}/api/settings`);
  const settings = await res.json();
  defaultServings = parseInt(settings.default_servings, 10) || 2;
  document.getElementById('defaultServingsInput').value = defaultServings;
}

async function saveDefaultServings() {
  const val = parseInt(document.getElementById('defaultServingsInput').value, 10) || 2;
  defaultServings = val;
  await fetch(`${API}/api/settings`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'default_servings', value: val })
  });
}

// ---------- Staples ----------

async function loadStaples() {
  const res = await fetch(`${API}/api/staples`);
  const staples = await res.json();
  const el = document.getElementById('stapleList');

  if (!staples.length) {
    el.innerHTML = '<span class="empty">No staples yet — add things like salt, sugar, oil below.</span>';
    return;
  }

  el.innerHTML = staples.map(s => `
    <span class="staple-pill">
      ${escapeHtml(s.item_name)}
      <button onclick="removeStaple('${s.id}')" title="Remove">&times;</button>
    </span>
  `).join('');
}

async function addStaple() {
  const input = document.getElementById('newStaple');
  const itemName = input.value.trim();
  if (!itemName) return;

  await fetch(`${API}/api/staples`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ itemName })
  });
  input.value = '';
  loadStaples();
  if (selectedShoppingBatchId) loadShoppingList(selectedShoppingBatchId);
}

async function removeStaple(id) {
  await fetch(`${API}/api/staples`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  loadStaples();
  if (selectedShoppingBatchId) loadShoppingList(selectedShoppingBatchId);
}

// ---------- Recipes: import, gallery, detail ----------

async function loadRecipes() {
  const res = await fetch(`${API}/api/recipes`);
  recipes = await res.json();
  renderRecipeGrid();
}

function renderRecipeGrid() {
  const el = document.getElementById('recipeGrid');
  if (!recipes.length) {
    el.innerHTML = '<div class="empty">No recipes yet — import one above.</div>';
    return;
  }
  el.innerHTML = `<div class="recipe-grid">${recipes.map(r => `
    <div class="recipe-card" onclick="openRecipeDetail('${r.id}')">
      ${thumbHtml(r, 'thumb')}
      <div class="recipe-title">${escapeHtml(displayName(r))}</div>
      <div class="recipe-meta">${r.servings ? `serves ${r.servings}` : ''}${r.cook_time_minutes ? ` · ${r.cook_time_minutes} min` : ''}</div>
    </div>
  `).join('')}</div>`;
}

async function importRecipe() {
  const urlInput = document.getElementById('recipeUrl');
  const status = document.getElementById('importStatus');
  const url = urlInput.value.trim();
  if (!url) return;

  status.textContent = 'Importing…';
  status.className = 'status';

  try {
    const res = await fetch(`${API}/api/scrape-recipe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Import failed');

    if (data.needsBrowser) {
      status.textContent = "This site couldn't be scraped even with JS rendering — try another URL.";
      status.className = 'status error';
      return;
    }

    status.textContent = `Saved: ${data.title}${data.confidence === 'low' ? ' (low confidence — worth checking the ingredients)' : ''}`;
    status.className = 'status ok';
    urlInput.value = '';
    await loadRecipes();
  } catch (err) {
    status.textContent = err.message;
    status.className = 'status error';
  }
}

async function openRecipeDetail(id) {
  const res = await fetch(`${API}/api/recipe?id=${id}`);
  const recipe = await res.json();
  currentRecipeDetail = recipe;
  renderRecipeDetail(recipe.servings || defaultServings);
  document.getElementById('recipeOverlay').classList.add('active');
}

function closeRecipeDetail() {
  document.getElementById('recipeOverlay').classList.remove('active');
  currentRecipeDetail = null;
}

async function saveNickname() {
  const nickname = document.getElementById('nicknameInput').value.trim();
  const res = await fetch(`${API}/api/recipe?id=${currentRecipeDetail.id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nickname })
  });
  const updated = await res.json();
  currentRecipeDetail.nickname = updated.nickname;
  loadRecipes();
}

function renderRecipeDetail(targetServings) {
  const r = currentRecipeDetail;
  const original = r.servings;
  const scale = original ? targetServings / original : 1;

  const ingredientsHtml = r.ingredients.map(ing => {
    const scaledQty = ing.quantity !== null ? Math.round(ing.quantity * scale * 100) / 100 : null;
    return `<li>${scaledQty !== null ? `<span class="qty">${scaledQty}${ing.unit || ''}</span> ` : ''}${escapeHtml(cap(ing.item))}${ing.notes ? `, ${escapeHtml(ing.notes)}` : ''}</li>`;
  }).join('');

  document.getElementById('recipeOverlayContent').innerHTML = `
    ${r.image_url ? `<img class="overlay-img" src="${escapeHtml(r.image_url)}" alt="">` : `<div class="overlay-img-placeholder">🍽️</div>`}
    <div class="overlay-title">${escapeHtml(displayName(r))}</div>
    <div class="overlay-meta">${r.cook_time_minutes ? `${r.cook_time_minutes} min · ` : ''}${r.confidence === 'low' ? 'low-confidence import, worth double-checking' : ''}</div>

    <div class="nickname-row">
      <label>Nickname (shortens it everywhere in the app)</label>
      <input type="text" id="nicknameInput" value="${escapeHtml(r.nickname || '')}" placeholder="${escapeHtml(r.title)}" onchange="saveNickname()">
    </div>

    <div class="scale-row">
      <label>Servings</label>
      <input type="number" id="scaleServings" value="${targetServings}" min="1" onchange="renderRecipeDetail(parseInt(this.value,10) || 1)">
      ${!original ? '<span class="empty" style="font-size:0.75rem;">(original servings unknown — showing as-scraped)</span>' : ''}
    </div>
    <ul class="overlay-ing-list">${ingredientsHtml}</ul>
    ${r.steps && r.steps.length ? `<ol>${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>` : '<div class="empty">No steps saved for this recipe.</div>'}
  `;
}

// ---------- Picker + Review overlay (shared by "new batch" and "add to batch") ----------

function openPicker(mode, batchId) {
  pickerMode = mode;
  pickerBatchId = batchId;
  pickerScreen = 'grid';
  pendingSelections = new Map();
  document.getElementById('pickerOverlay').classList.add('active');
  renderPickerScreen();
}

function closePickerOverlay() {
  document.getElementById('pickerOverlay').classList.remove('active');
  pickerMode = null; pickerBatchId = null; pendingSelections = new Map();
}

function renderPickerScreen() {
  if (pickerScreen === 'grid') renderPickerGrid();
  else renderPickerReview();
}

function renderPickerGrid() {
  document.getElementById('pickerStepLabel').textContent = 'Choose meals';
  const content = document.getElementById('pickerOverlayContent');

  if (!recipes.length) {
    content.innerHTML = '<p class="empty">No recipes yet — import some from the Recipes tab first.</p>';
    document.getElementById('pickerBottomBar').innerHTML = '';
    return;
  }

  content.innerHTML = `<div class="recipe-grid">${recipes.map(r => `
    <div class="recipe-card">
      ${thumbHtml(r, 'thumb')}
      <div class="recipe-title">${escapeHtml(displayName(r))}</div>
      <div class="recipe-meta">${r.servings ? `serves ${r.servings}` : ''}${r.cook_time_minutes ? ` · ${r.cook_time_minutes} min` : ''}</div>
      <button class="add-btn ${pendingSelections.has(r.id) ? 'added' : ''}" onclick="togglePendingRecipe('${r.id}')">${pendingSelections.has(r.id) ? '✓' : '+'}</button>
    </div>
  `).join('')}</div>`;

  document.getElementById('pickerBottomBar').innerHTML = `
    <div class="inner">
      <button class="btn-primary btn-full" onclick="goToReview()" ${pendingSelections.size === 0 ? 'disabled style="opacity:0.5;"' : ''}>
        Review recipes ${pendingSelections.size ? `(${pendingSelections.size})` : ''}
      </button>
    </div>
  `;
}

function togglePendingRecipe(recipeId) {
  if (pendingSelections.has(recipeId)) pendingSelections.delete(recipeId);
  else pendingSelections.set(recipeId, defaultServings);
  renderPickerGrid();
}

function goToReview() {
  pickerScreen = 'review';
  renderPickerReview();
}

function renderPickerReview() {
  document.getElementById('pickerStepLabel').textContent = 'Review';
  const content = document.getElementById('pickerOverlayContent');

  const items = [...pendingSelections.entries()].map(([id, servings]) => ({
    recipe: recipes.find(r => r.id === id), servings, id
  }));

  content.innerHTML = `
    <span class="back-link" onclick="pickerScreen='grid'; renderPickerScreen();">&larr; Back to meals</span>
    ${items.map(item => `
      <div class="review-item">
        ${item.recipe.image_url ? `<img src="${escapeHtml(item.recipe.image_url)}" alt="">` : `<div class="thumb-sm-placeholder2">🍽️</div>`}
        <div class="review-info">
          <div class="recipe-title">${escapeHtml(displayName(item.recipe))}</div>
        </div>
        <div class="stepper">
          <button onclick="adjustReviewServings('${item.id}', -1)">&minus;</button>
          <span class="val">${item.servings}</span>
          <button onclick="adjustReviewServings('${item.id}', 1)">+</button>
        </div>
        <button class="remove-x" onclick="removePendingFromReview('${item.id}')">&times;</button>
      </div>
    `).join('') || '<p class="empty">Nothing selected.</p>'}
  `;

  document.getElementById('pickerBottomBar').innerHTML = `
    <div class="inner">
      <button class="btn-primary btn-full" onclick="commitPickerSelections()" ${items.length === 0 ? 'disabled style="opacity:0.5;"' : ''}>All done</button>
    </div>
  `;
}

function adjustReviewServings(recipeId, delta) {
  const current = pendingSelections.get(recipeId) || defaultServings;
  pendingSelections.set(recipeId, Math.max(1, current + delta));
  renderPickerReview();
}

function removePendingFromReview(recipeId) {
  pendingSelections.delete(recipeId);
  renderPickerReview();
}

async function commitPickerSelections() {
  const entries = [...pendingSelections.entries()];
  if (!entries.length) return;

  if (pickerMode === 'new') {
    const recipesPayload = entries.map(([recipeId, servings]) => ({ recipeId, servingsOverride: servings }));
    await fetch(`${API}/api/weekly-plans`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipes: recipesPayload, servingsTarget: defaultServings })
    });
  } else {
    for (const [recipeId, servings] of entries) {
      await fetch(`${API}/api/weekly-plan?id=${pickerBatchId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ recipeId, servingsOverride: servings })
      });
    }
  }

  const wasExisting = pickerMode === 'existing';
  const batchIdToReopen = pickerBatchId;
  closePickerOverlay();
  await loadBatches();
  renderBatchList();
  if (wasExisting) openBatchDetail(batchIdToReopen);
}

// ---------- Batches tab (home page) ----------

async function loadBatches() {
  const res = await fetch(`${API}/api/weekly-plans`);
  batches = await res.json();
  // Oldest first (top), newest last (bottom)
  batches.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}

function renderBatchList() {
  const el = document.getElementById('batchList');
  if (!batches.length) {
    el.innerHTML = '<p class="empty">No batches yet — tap "+ New batch" above to get started.</p>';
    return;
  }

  el.innerHTML = batches.map(b => `
    <div class="batch-card">
      <div class="batch-date-row">
        <div>
          <div class="batch-date">${formatBatchDate(b.week_start_date)}</div>
          <div class="batch-meta">serves ${b.servings_target}</div>
        </div>
        <span class="badge badge-${b.status}">${b.status}</span>
      </div>
      <div id="batch-strip-${b.id}"><span class="empty">Loading meals…</span></div>
      <button class="btn-secondary btn-full btn-sm" onclick="openBatchDetail('${b.id}')">View batch</button>
    </div>
  `).join('');

  // Fetch each batch's recipes for the photo strip (lightweight, only IDs+images needed)
  batches.forEach(b => loadBatchStrip(b.id));
}

async function loadBatchStrip(batchId) {
  const res = await fetch(`${API}/api/weekly-plan?id=${batchId}`);
  const batch = await res.json();
  const el = document.getElementById(`batch-strip-${batchId}`);
  if (!el) return;

  if (!batch.recipes.length) {
    el.innerHTML = '<p class="empty">No meals chosen this week</p>';
    return;
  }

  el.innerHTML = `<div class="photo-strip">${batch.recipes.map(r => `
    <div class="strip-item" onclick="openBatchDetail('${batchId}')">
      ${r.image_url ? `<img src="${escapeHtml(r.image_url)}" alt="">` : `<div class="strip-placeholder">🍽️</div>`}
      <div class="strip-name">${escapeHtml(displayName(r))}</div>
    </div>
  `).join('')}</div>`;
}

async function openBatchDetail(batchId) {
  const res = await fetch(`${API}/api/weekly-plan?id=${batchId}`);
  const batch = await res.json();

  document.getElementById('batchListSection').style.display = 'none';
  document.getElementById('batchDetailSection').style.display = 'block';
  document.getElementById('batchDetailTitle').innerHTML = `${formatBatchDate(batch.week_start_date)} <span class="badge badge-${batch.status}">${batch.status}</span>`;

  const recipeRows = batch.recipes.map(r => `
    <div class="recipe-item">
      <div onclick="openRecipeDetailFromBatch('${r.id}')" style="display:flex; align-items:center; gap:0.6rem; flex:1; cursor:pointer;">
        ${thumbHtml(r, 'thumb-sm')}
        <div>
          <div class="recipe-title">${escapeHtml(displayName(r))}</div>
          <div class="recipe-meta">${r.servingsOverride ? `serves ${r.servingsOverride}` : ''}</div>
        </div>
      </div>
      <button class="btn-danger btn-sm" onclick="deleteRecipeFromBatch('${batch.id}', '${r.id}', '${batch.status}')">Remove</button>
    </div>
  `).join('') || '<p class="empty">No meals in this batch yet.</p>';

  document.getElementById('batchDetailContent').innerHTML = `
    ${recipeRows}
    <button class="btn-secondary btn-full" style="margin-top:0.8rem;" onclick="openPicker('existing', '${batch.id}')">+ Add a meal</button>
    ${batch.status === 'planning' ? `
      <button class="btn-primary btn-full" onclick="switchTab('shopping'); selectShoppingBatch('${batch.id}')">Shop this batch</button>
    ` : `
      <button class="btn-secondary btn-full" onclick="switchTab('shopping'); selectShoppingBatch('${batch.id}')">View shopping list</button>
    `}
  `;
}

function openRecipeDetailFromBatch(recipeId) {
  openRecipeDetail(recipeId);
}

async function deleteRecipeFromBatch(batchId, recipeId, batchStatus) {
  const message = batchStatus === 'ordered'
    ? 'This batch has already been ordered — you may have already bought ingredients for this recipe. Remove it anyway?'
    : 'Remove this recipe from the batch?';

  if (!confirm(message)) return;

  await fetch(`${API}/api/weekly-plan?id=${batchId}`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ recipeId })
  });
  openBatchDetail(batchId);
}

function closeBatchDetail() {
  document.getElementById('batchDetailSection').style.display = 'none';
  document.getElementById('batchListSection').style.display = 'block';
  loadBatches().then(renderBatchList);
}

// ---------- Shopping tab ----------

function renderShoppingChooser() {
  const planning = batches.filter(b => b.status === 'planning');
  const el = document.getElementById('shoppingChooserList');

  if (!planning.length) {
    el.innerHTML = '<div class="empty">No open batches — create one on the <strong>Batches</strong> tab first.</div>';
    return;
  }

  el.innerHTML = planning.map(b => `
    <div class="batch-card" onclick="selectShoppingBatch('${b.id}')" style="cursor:pointer;">
      <div class="batch-date">${formatBatchDate(b.week_start_date)}</div>
      <div class="batch-meta">serves ${b.servings_target}</div>
    </div>
  `).join('');
}

async function selectShoppingBatch(batchId) {
  selectedShoppingBatchId = batchId;
  document.getElementById('shoppingChooserSection').style.display = 'none';
  document.getElementById('activeShoppingSection').style.display = 'block';
  await loadShoppingList(batchId);
}

function backToShoppingChooser() {
  selectedShoppingBatchId = null;
  document.getElementById('activeShoppingSection').style.display = 'none';
  document.getElementById('shoppingChooserSection').style.display = 'block';
  loadBatches().then(renderShoppingChooser);
}

async function loadShoppingList(batchId) {
  const res = await fetch(`${API}/api/weekly-plan-shopping-list?id=${batchId}`);
  const data = await res.json();
  lastShoppingListData = data;
  document.getElementById('shoppingBatchTitle').textContent = 'Shopping list';
  renderReceipt(data);
}

function renderReceipt(data, aiCleaned) {
  const date = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  const list = aiCleaned || data.shoppingList;

  const categoryOrder = ['Fruit & Veg', 'Meat & Fish', 'Dairy & Eggs', 'Bakery', 'Frozen', 'Store Cupboard', 'Herbs & Spices', 'Other'];
  const grouped = {};
  list.forEach(item => {
    (grouped[item.category] = grouped[item.category] || []).push(item);
  });

  const categoryHtml = categoryOrder
    .filter(cat => grouped[cat] && grouped[cat].length)
    .map(cat => `
      <details class="category-group" open>
        <summary>${cat} <span class="count">(${grouped[cat].length})</span></summary>
        ${grouped[cat].map(item => `
          <div class="receipt-line" data-item="${escapeHtml(item.item)}">
            <span class="item-info">
              ${escapeHtml(cap(item.item))}
              <span class="used-in">${item.usedIn.map(escapeHtml).join(', ')}</span>
              ${item.note ? `<span class="note">${escapeHtml(item.note)}</span>` : ''}
            </span>
            <span class="qty">${item.quantity !== null ? item.quantity + (item.unit ? item.unit : '') : ''}</span>
            <span class="item-actions">
              <button class="btn-gotit" onclick="markGotIt('${escapeHtml(item.item)}', this)">Got it</button>
              <button class="btn-staple" onclick="markStaple('${escapeHtml(item.item)}', this)" title="Always have — never show again">Always have</button>
            </span>
          </div>
        `).join('')}
      </details>
    `).join('');

  const sortedThisWeek = data.excludedAsAlreadyHave.length
    ? `<details class="sorted-section">
        <summary>Already sorted this batch (${data.excludedAsAlreadyHave.length}) — tap to view/undo</summary>
        ${data.excludedAsAlreadyHave.map(name => `
          <div class="sorted-line">
            ${escapeHtml(cap(name))}
            <button onclick="undoGotIt('${escapeHtml(name)}')">Undo</button>
          </div>
        `).join('')}
      </details>`
    : '';

  document.getElementById('receiptWrap').innerHTML = `
    <div class="receipt">
      <div class="receipt-header">
        <div class="r-title">Shopping List</div>
        <div class="r-sub">${date} · serves ${data.servingsTarget} · ${data.recipeCount} recipe${data.recipeCount === 1 ? '' : 's'}${aiCleaned ? ' · tidied by AI' : ''}</div>
      </div>
      <div class="receipt-divider"></div>
      ${categoryHtml || '<div class="empty">Nothing left to buy — you have it all!</div>'}
      ${sortedThisWeek}
    </div>
  `;
}

async function sortWithAI() {
  if (!lastShoppingListData || !lastShoppingListData.shoppingList.length) return;
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = 'Sorting…';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/api/ai-shopping-cleanup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shoppingList: lastShoppingListData.shoppingList })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'AI cleanup failed');

    renderReceipt(lastShoppingListData, data.cleanedList);
  } catch (err) {
    alert('AI sort failed: ' + err.message + ' — showing the original list.');
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function markGotIt(itemName) {
  await fetch(`${API}/api/weekly-plan-exclude`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ planId: selectedShoppingBatchId, itemName })
  });
  loadShoppingList(selectedShoppingBatchId);
}

async function undoGotIt(itemName) {
  await fetch(`${API}/api/weekly-plan-exclude`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ planId: selectedShoppingBatchId, itemName })
  });
  loadShoppingList(selectedShoppingBatchId);
}

async function markStaple(itemName) {
  await fetch(`${API}/api/staples`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ itemName })
  });
  loadStaples();
  loadShoppingList(selectedShoppingBatchId);
}

async function markOrdered() {
  const status = document.getElementById('orderStatus');
  status.textContent = 'Saving…';
  status.className = 'status';

  try {
    const res = await fetch(`${API}/api/weekly-plan?id=${selectedShoppingBatchId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'ordered' })
    });
    if (!res.ok) throw new Error('Failed to mark as ordered');

    status.textContent = '';
    backToShoppingChooser();
  } catch (err) {
    status.textContent = err.message;
    status.className = 'status error';
  }
}

// ---------- Init ----------

async function init() {
  await loadSettings();
  await loadStaples();
  await loadRecipes();
  await loadBatches();

  renderBatchList();
  renderShoppingChooser();
}

init();
</script>

</body>
</html>
